<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Join | Fronterra SMP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="tutorial-section">
        <!-- Reusing your Season 2 logo -->
        <img src="FronterraSeason2.png" alt="Fronterra Season 2" class="main-logo tutorial-logo">
        
        <!-- Step 1 -->
        <div class="step-container">
            <h2 class="step-number">Step 1</h2>
            <p class="step-text">Launch your Minecraft Client & Press "Multiplayer".</p>
            <div class="image-container">
                <!-- Replace with: <img src="step1.png" alt="Minecraft Menu"> -->
                <span>[Insert Step 1 Screenshot Here]</span>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="step-container">
            <h2 class="step-number">Step 2</h2>
            <p class="step-text">Press "Add Server" at the bottom of your screen.</p>
            <div class="image-container">
                <!-- Replace with: <img src="step2.png" alt="Multiplayer Menu"> -->
                <span>[Insert Step 2 Screenshot Here]</span>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="step-container">
            <h2 class="step-number">Step 3</h2>
            <p class="step-text">Enter Our Server IP: <strong>play.fronterra.site</strong> & Hit Done!</p>
            <div class="image-container">
                <!-- Replace with: <img src="step3.png" alt="Add Server Screen"> -->
                <span>[Insert Step 3 Screenshot Here]</span>
            </div>
        </div>

        <a href="index.html" class="btn btn-discord btn-back">BACK TO HOME</a>
    </div>
</body>
</html>
