<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Fronterra SMP</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0e;
            background-image: url('fronimg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: rgba(11, 11, 14, 0.85); /* Semi-transparent dark overlay to make text readable */
            padding: 50px 70px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .logo {
            max-width: 350px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0 0 35px 0;
            font-weight: 400;
            color: #d1d1d1;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            color: white;
            background-color: #5865F2; /* Discord Blurple */
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-youtube {
            background-color: #FF0000; /* YouTube Red */
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:hover:not(.btn-youtube) {
            background-color: #4752c4;
        }

        .btn:hover.btn-youtube {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Make sure FronterraSeason2.png is in the same folder as this HTML file -->
        <img src="FronterraSeason2.png" alt="Fronterra SMP Season 2" class="logo">
        
        <h1>Under Construction</h1>
        <h2>Fronterra SMP Season 2 Launches November 1st!</h2>
        
        <div class="button-container">
            <!-- Ensure https:// is included so the links direct externally and not to a local folder -->
            <a href="https://discord.gg/fronterra" target="_blank" class="btn">Join the Discord</a>
            <a href="https://www.youtube.com/@FronterraSMP" target="_blank" class="btn btn-youtube">YouTube Channel</a>
        </div>
    </div>

</body>
</html>
