<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fronterra SMP | Season 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="hero-section">
        <div class="content">
            <!-- New Logo Integration -->
            <img src="FronterraSeason2.png" alt="Fronterra Season 2 Logo" class="main-logo">
            
            <p class="subtitle">The ultimate survival multiplayer experience.</p>
            
            <!-- NEW: Animated "Join Now!" Graphic (Replaces the Cube) -->
            <img src="JoinNow.png" alt="Join Now!" class="join-now-banner">

<!-- Interactive IP Box with Live Player Count -->
        <div class="ip-box" id="ipBox">
            <span id="ipText">Fronterra.apexmc.com</span>
            <div class="status-container">
                <span class="status-dot" id="statusDot"></span>
                <span class="player-count" id="playerCount">Loading players...</span>
            </div>
            <span class="copy-hint">Click to copy IP</span>
        </div>

        <!-- Navigation Buttons -->
        <div class="button-group">
            <span class="btn btn-coming-soon">COMING SOON!</span>
            <a href="https://discord.gg/fronterra" class="btn btn-discord">DISCORD</a>
            <a href="#" class="btn btn-map">LIVE MAP</a>
        </div>
